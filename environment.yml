# Python environment for the whole repository.
# The GPU stages (decoding, attribution patching, activation patching, probe
# features) need a CUDA build of PyTorch and an A100-class GPU; every analysis
# and figure script runs on CPU.
#   conda env create -f environment.yml && conda activate arith-circuits
name: arith-circuits
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.3.5
      - scipy==1.16.3
      - scikit-learn==1.8.0
      - matplotlib==3.10.8
      - tqdm==4.67.1
      - torch==2.9.1
      - transformers==4.57.5
      - accelerate==1.12.0
      - num2words==0.5.14
